name: publish
on:
  push:
    branches:
      - main # 仅当推送到 main 分支时触发
permissions:
  id-token: write # 设置身份令牌的权限为写
  contents: write # 设置内容的权限为写
  pull-requests: write # 设置拉取请求的权限为写
  issues: write # 设置问题的权限为写
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save node-karin@^1.16.3
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-please:
    needs: quality
    # 设置工作流程运行环境为 Ubuntu
    runs-on: ubuntu-latest
    steps:
      # 使用 release-please-action@v3 动作
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          # 设置发布类型为 Node.js
          release-type: node
      # 检出代码
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      # 设置 Node.js 环境
      - uses: actions/setup-node@v4
        with:
          # 设置 Node.js 版本
          node-version: 22
          # 设置 npm 注册表 URL
          registry-url: https://registry.npmjs.org
        if: ${{ steps.release.outputs.release_created }}
      # 安装 npm 11+，npm Trusted Publishing 需要 npm >= 11.5.1
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created }}
      # 安装依赖
      - run: npm install
        if: ${{ steps.release.outputs.release_created }}
      - run: npm install --no-save node-karin@^1.16.3
        if: ${{ steps.release.outputs.release_created }}
      # 编译
      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}
      # 发布到 npm；Trusted Publishing 通过 GitHub OIDC 授权，不传 NODE_AUTH_TOKEN
      - run: npm run pub
        if: ${{ steps.release.outputs.release_created }}
